name: CI

# Without this, "the build fails" is an aspiration rather than a fact. Every push
# and every pull request runs the same three gates a developer runs locally:
# lint (including the architectural import boundaries), typecheck, and tests.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` — a clean, lockfile-exact install. Fails if package.json and
      # package-lock.json have drifted, which is itself worth catching.
      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
        env:
          # src/config/env refuses to start without endpoints rather than
          # silently defaulting to the production API. Tests supply their own
          # fakes via jest.env.js; these exist so any non-test code path that
          # reads config during CI also fails safe, never toward production.
          EXPO_PUBLIC_BASE_SERVICE_URL: https://api.horcery.invalid/
          EXPO_PUBLIC_FEDERATED_PROMETHEUS_BASE_URL: https://metrics.horcery.invalid/api/v1
          EXPO_PUBLIC_ACCOUNT_MANAGEMENT_URL: https://accounts.horcery.invalid/
          EXPO_PUBLIC_ALLOW_PRODUCTION_WRITES: 'false'
          EXPO_PUBLIC_ENABLE_PREVIEWS: 'false'
